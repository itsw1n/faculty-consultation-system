name: Commit Messages

# Every commit on a PR must use the conventional `type(scope):message`
# format because the Release workflow derives the next semantic version
# from those labels. Merge commits are skipped.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message format
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pattern='^(feat|fix|refactor|docs|style|chore|test|ci)(\([^)]*\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            case "$subject" in
              'Merge '*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Non-conventional commit message: $subject"
              bad=1
            fi
          done < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate --jq '.[].commit.message | split("\n")[0]')
          if [ "$bad" -ne 0 ]; then
            echo 'Commit messages must match type(scope):message, e.g. feat(frontend):add shared modal dialog'
            exit 1
          fi
          echo 'All commit messages are conventional.'
